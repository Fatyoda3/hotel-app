services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-app
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/hoteldb
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"

  nginx:
    image: nginx:latest
    container_name: hotel-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server