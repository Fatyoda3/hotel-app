version: '3.9'

services:

  server:
    build: .

    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/hoteldb

    depends_on:
      - mongodb

    deploy:
      replicas: 3

    expose:
      - "8080"

  mongodb:
    image: mongo:7
    container_name: mongo

    ports:
      - "27017:27017"

  nginx:
    image: nginx:latest
    container_name: hotel-nginx

    ports:
      - "3000:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - server