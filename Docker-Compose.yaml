version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "hotel-app"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/hoteldb
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"

  nginix:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server


